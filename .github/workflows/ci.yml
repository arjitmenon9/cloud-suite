name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  utility-hub-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utility-hub
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm', cache-dependency-path: utility-hub/package-lock.json }
      - run: npm ci
      - run: npm test
        env:
          REDIS_URL: redis://localhost:6379
          REDIS_TLS: 'false'

  stats-cron-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats-cron
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm', cache-dependency-path: stats-cron/package-lock.json }
      - run: npm ci
      - run: npm test
        env:
          REDIS_URL: redis://localhost:6379
          REDIS_TLS: 'false'

  docker-build:
    runs-on: ubuntu-latest
    needs: [utility-hub-test, stats-cron-test]
    strategy:
      matrix:
        app: [utility-hub, stats-cron]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: false
          load: true
          tags: ${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
